<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#dc2626">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Thank You | Tom Cutts Joinery &amp; Building</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: #fff; font-family: Arial, sans-serif; }
        main { max-width: 640px; padding: 48px 32px; border: 1px solid #334155; border-radius: 16px; background: #1e293b; text-align: center; }
        .brand { color: #f87171; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
        h1 { font-size: clamp(32px, 6vw, 44px); margin: 24px 0 16px; }
        p { color: #cbd5e1; font-size: 18px; line-height: 1.65; }
        a { color: #fff; text-underline-offset: 4px; }
        .button { display: inline-block; margin-top: 16px; padding: 16px 24px; border-radius: 8px; background: #dc2626; color: #fff; font-weight: 700; text-decoration: none; }
        .button:hover { background: #b91c1c; }
        a:focus-visible { outline: 3px solid #fca5a5; outline-offset: 5px; }
    </style>
</head>
<body>
    <main>
        <div class="brand">Tom Cutts Joinery &amp; Building</div>
        <h1>Thank you for your enquiry.</h1>
        <p>Your message has been received. Tom will be in touch to discuss your project.</p>
        <p>If your enquiry is urgent, call <a href="tel:07816937159">07816 937 159</a>.</p>
        <a class="button" href="/">Back to the website</a>
    </main>
</body>
</html>
